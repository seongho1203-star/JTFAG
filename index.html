<body>

<div class="container">
    <div class="header-area">
        <h1>JTFAG LEAGUE</h1>
        <p class="subtitle">⛳ REALTIME GOLF SYSTEM</p>
    </div>

    <div class="notice-card">
        <h2>
            <span>📢 리그 공지 & 모임 공금</span>
            <button type="button" class="lock-btn" id="lockToggleBtn" onclick="toggleFundLock()" title="수정 잠금/해제">🔒</button>
        </h2>
        <div class="notice-grid">
            <div class="notice-box">
                <label>📅 다음 라운드 일정</label>
                <input type="text" id="nextRoundInput" class="notice-input" placeholder="예: 8/15(토) 함평엘리체" onchange="updateNoticeData()">
            </div>
            
            <div class="notice-box">
                <label>💰 공금 잔액</label>
                <input type="text" inputmode="numeric" id="clubFundInput" class="notice-input" placeholder="예: 150,000" readonly onclick="handleInputClick(this)" onfocus="this.select()" onchange="updateNoticeData()" style="text-align: right;">
            </div>
            
            <div class="weather-box">
                <span style="font-size:0.65rem; color:#bae6fd; font-weight:800; letter-spacing: 0.5px;">🌤️ 실시간 날씨 연동</span>
                <span id="weatherText" style="font-size:0.85rem; color:#ffffff; font-weight:800; word-break: keep-all; line-height: 1.3;">일정과 골프장을 입력해주세요</span>
            </div>
        </div>
    </div>

    <div class="total-summary-card">
        <h2>💰 JTFAG 통합 정산 요약</h2>
        <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <div class="money-card">
        <div class="money-header-flex">
            <h3>💵 차수별 정산</h3>
            <select id="moneyRoundSelect" class="round-select-badge" onchange="changeMoneyRound(this.value)"></select>
        </div>
        <table class="money-table">
            <thead>
                <tr>
                    <th style="width: 18%;">이름</th>
                    <th style="width: 25%;">시작 금액</th>
                    <th style="width: 25%;">남은 금액</th>
                    <th style="width: 16%;">계급정산</th>
                    <th style="width: 16%;">타수정산</th>
                </tr>
            </thead>
            <tbody id="moneyTbody"></tbody>
        </table>
    </div>

    <div class="info-card">
        <span class="info-text" id="infoText">💡 <b>최근 2경기 스코어</b> 기준 1:1 핸디캡 산출</span>
        <span class="save-status" id="saveStatus">⚡ 동기화 대기중</span>
    </div>

    <div class="btn-group">
        <div class="left-btns">
            <button type="button" class="action-btn add-btn" onclick="addRound()">+ 차수 추가</button>
            <button type="button" class="action-btn remove-btn" onclick="removeRound()">- 최근 삭제</button>
        </div>
        <div class="right-btns">

        </div>
    </div>

    <div class="scroll-hint">↔️ 표를 좌우로 스크롤하여 확인하세요</div>
    <div class="table-wrapper">
        <table id="scoreTable">
            <thead>
                <tr id="headerRow"><th>이름</th></tr>
            </thead>
            <tbody id="scoreTbody"></tbody>
        </table>
    </div>

    <div class="match-card">
        <h3 id="matchCardTitle">🤝 최근 2경기 평균 기반 1:1 핸디캡 관계</h3>
        <div class="match-grid" id="matchGrid"></div>
    </div>

    <div class="history-btn-container">
        <button type="button" class="open-history-btn" onclick="openHistoryModal()">📜 라운드별 계급 정산 이력 보기 ▾</button>
    </div>
</div>

<div class="modal-overlay" id="historyModal" onclick="closeHistoryModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>📜 라운드별 계급 정산 이력</h3>
            <button type="button" class="close-btn" onclick="closeHistoryModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="history-list" id="historyList"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="personalReportModal" onclick="closePersonalReport(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="reportTitle">⛳ 개인 리포트</h3>
            <button type="button" class="close-btn" onclick="closePersonalReport()">✕</button>
        </div>
        <div class="modal-body" id="reportContent"></div>
    </div>
</div>

<div id="customToast"></div>

<script>
    const ADMIN_PASSWORD = "1234";
    let isFundUnlocked = false;
    const golfers = ["이관교", "김지명", "신성호", "박승수"];

    const RANK_CONFIG = {
        0: { name: "독수리", icon: "🦅", penalty: 0, class: "rank-eagle" },
        1: { name: "매", icon: "⚡", penalty: -40000, class: "rank-hawk" },
        2: { name: "학", icon: "🦩", penalty: -60000, class: "rank-crane" },
        3: { name: "참새", icon: "🐦", penalty: -100000, class: "rank-sparrow" }
    };

    function getDefaultData() {
        return {
            nextRoundDate: "",
            clubFund: 0,
            noticeMemo: "",
            totalRounds: 4,
            courses: ["함평엘리체", "함평엘리체", "어등산", "해피니스"],
            scores: {
                "이관교": [90, 83, 97, 92],
                "김지명": [87, 87, 86, 86],
                "신성호": [88, 85, 85, 93],
                "박승수": [96, 96, 88, 90]
            },
            roundMoney: [
                { "이관교": { start: 0, end: 0 }, "김지명": { start: 0, end: 0 }, "신성호": { start: 0, end: 0 }, "박승수": { start: 0, end: 0 } },
                { "이관교": { start: 0, end: 0 }, "김지명": { start: 0, end: 0 }, "신성호": { start: 0, end: 0 }, "박승수": { start: 0, end: 0 } },
                { "이관교": { start: 0, end: 0 }, "김지명": { start: 0, end: 0 }, "신성호": { start: 0, end: 0 }, "박승수": { start: 0, end: 0 } },
                { "이관교": { start: 530000, end: 450000 }, "김지명": { start: 100000, end: 135000 }, "신성호": { start: 230000, end: 92000 }, "박승수": { start: 356000, end: 340000 } }
            ]
        };
    }

    let appData = getDefaultData();
    let historyStack = [];
    let selectedMoneyRoundIdx = -1;
    let cachedRoundRankProfit = {}; 
    let golferRankHistory = {};
    let globalHeadToHead = {};

    function authenticateAdmin() {
        if (isFundUnlocked) return true;
        const pwd = prompt("🔒 비밀번호를 입력해주세요:");
        if (pwd === ADMIN_PASSWORD) {
            isFundUnlocked = true;
            updateLockUI();
            showToast("🔓 수정 권한 인증됨");
            return true;
        } else if (pwd !== null) {
            showToast("⚠️ 비밀번호 불일치");
        }
        return false;
    }

    function toggleFundLock() {
        if (isFundUnlocked) {
            isFundUnlocked = false;
            updateLockUI();
            showToast("🔒 공금 잠김");
        } else { authenticateAdmin(); }
    }

    function handleInputClick(inputElem) {
        if (!isFundUnlocked) {
            if (authenticateAdmin()) setTimeout(() => { inputElem.focus(); }, 50);
        }
    }

    function updateLockUI() {
        const btn = document.getElementById('lockToggleBtn');
        const fundInput = document.getElementById('clubFundInput');
        if (btn) btn.textContent = isFundUnlocked ? "🔓" : "🔒";
        if (fundInput) {
            if (isFundUnlocked) fundInput.removeAttribute('readonly');
            else fundInput.setAttribute('readonly', 'true');
        }
    }

    function formatNumber(num) {
        if (!num || isNaN(num)) return "0";
        return num.toLocaleString('ko-KR');
    }

    function parseNumber(val) {
        if (!val) return 0;
        return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
    }

    function saveState() {
        if (historyStack.length >= 10) historyStack.shift();
        historyStack.push(JSON.stringify(appData));
    }

    function undoLastAction() {
        if (historyStack.length === 0) {
            showToast("⚠️ 되돌릴 내역이 없습니다.");
            return;
        }
        appData = JSON.parse(historyStack.pop());
        syncToFirebase(appData);
        renderAll();
        showToast("↩️ 이전 상태로 복구됨");
    }

    window.addEventListener('DOMContentLoaded', () => {
        const checkFirebase = setInterval(() => {
            if (window.onSnapshot && window.gameDocRef) {
                clearInterval(checkFirebase);
                
                window.onSnapshot(window.gameDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const serverData = docSnap.data();
                        if (serverData && serverData.totalRounds) {
                            appData = serverData;
                        } else {
                            syncToFirebase(getDefaultData());
                            appData = getDefaultData();
                        }
                    } else {
                        syncToFirebase(getDefaultData());
                        appData = getDefaultData();
                    }
                    
                    if (selectedMoneyRoundIdx < 0 || selectedMoneyRoundIdx >= appData.totalRounds) {
                        selectedMoneyRoundIdx = appData.totalRounds - 1;
                    }

                    renderNoticeArea();
                    renderAll();
                    showSaveStatus("⚡ 실시간 동기화 완료");
                }, (error) => {
                    console.error("Firebase Error:", error);
                    showSaveStatus("⚠️ DB 연결 오류");
                });
            }
        }, 100);
    });

    function syncToFirebase(dataToSave) {
        if (!window.setDoc || !window.gameDocRef) return;
        showSaveStatus("💾 저장 중...");
        window.setDoc(window.gameDocRef, dataToSave, { merge: true }).then(() => {
            showSaveStatus("⚡ 실시간 동기화 완료");
        }).catch(err => {
            console.error("Firebase SetDoc Error:", err);
            showSaveStatus("⚠️ 저장 실패");
            showToast("⚠️ 네트워크 저장 실패");
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('customToast');
        if (!toast) return;
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2200);
    }

    function showSaveStatus(msg) {
        const saveStatus = document.getElementById('saveStatus');
        if (saveStatus) {
            saveStatus.textContent = msg;
            saveStatus.style.opacity = '1';
            setTimeout(() => { saveStatus.style.opacity = '0.7'; }, 1200);
        }
    }

    const GOLF_COORDS = [
        { keys: ["함평엘리체", "엘리체", "함평"], lat: 35.0658, lon: 126.5165, name: "함평(엘리체)" },
        { keys: ["해피니스", "해피"], lat: 34.9500, lon: 126.8150, name: "나주(해피니스)" },
        { keys: ["어등산", "어등"], lat: 35.1585, lon: 126.7570, name: "광주(어등산)" },
        { keys: ["광주"], lat: 35.1595, lon: 126.8526, name: "광주" }
    ];

    async function smartWeatherFetch(scheduleStr) {
        const wText = document.getElementById('weatherText');
        if (!wText) return;
        if (!scheduleStr) { wText.innerHTML = "일정과 골프장을 입력해주세요"; return; }

        wText.innerHTML = "조회 중... ⏳";
        let targetDate = null, shortDate = "";
        const dateMatch = scheduleStr.match(/(\d{1,2})[\/\.월]\s*(\d{1,2})/);
        if (dateMatch) {
            targetDate = `${new Date().getFullYear()}-${dateMatch[1].padStart(2, '0')}-${dateMatch[2].padStart(2, '0')}`;
            shortDate = `${dateMatch[1]}/${dateMatch[2]}`;
        }

        let lat = 35.1595, lon = 126.8526, locName = "광주(기본)";
        for (const item of GOLF_COORDS) {
            if (item.keys.some(k => scheduleStr.includes(k))) {
                lat = item.lat; lon = item.lon; locName = item.name; break;
            }
        }

        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=16`);
            const data = await res.json();
            let dayIdx = 0, dateLabel = "오늘 예보";
            if (targetDate && data.daily.time.includes(targetDate)) {
                dayIdx = data.daily.time.indexOf(targetDate);
                dateLabel = `${shortDate} 예보`;
            }
            const wCode = data.daily.weathercode[dayIdx];
            const tMax = Math.round(data.daily.temperature_2m_max[dayIdx]);
            const tMin = Math.round(data.daily.temperature_2m_min[dayIdx]);
            const rainProb = data.daily.precipitation_probability_max[dayIdx];

            let wEmoji = "🌤️";
            if (wCode <= 0) wEmoji = "☀️";
            else if (wCode <= 3) wEmoji = "⛅";
            else if (wCode <= 67 || (wCode >= 80 && wCode <= 82)) wEmoji = "🌧️";

            wText.innerHTML = `<span style="color:#fef08a;">${locName} (${dateLabel})</span> &nbsp;${wEmoji} ${tMin}°/${tMax}° &nbsp;☔${rainProb}%`;
        } catch(err) {
            wText.innerHTML = "날씨 정보 연동 실패 ⚠️";
        }
    }

    function renderMoneyTable() {
        const tbody = document.getElementById('moneyTbody');
        const selectBox = document.getElementById('moneyRoundSelect');
        if (!tbody || !selectBox) return;

        let selectHtml = "";
        for (let r = 0; r < appData.totalRounds; r++) {
            selectHtml += `<option value="${r}" ${r === selectedMoneyRoundIdx ? "selected" : ""}>${r + 1}차전 정산 입력 ▾</option>`;
        }
        selectBox.innerHTML = selectHtml;

        const currentRoundIdx = selectedMoneyRoundIdx;
        if (!appData.roundMoney) appData.roundMoney = [];
        if (!appData.roundMoney[currentRoundIdx]) {
            appData.roundMoney[currentRoundIdx] = {};
            golfers.forEach(g => appData.roundMoney[currentRoundIdx][g] = { start: 0, end: 0 });
        }

        const currMoney = appData.roundMoney[currentRoundIdx];
        tbody.innerHTML = "";

        golfers.forEach(g => {
            const m = currMoney[g] || { start: 0, end: 0 };
            const rankPenalty = cachedRoundRankProfit[g]?.[currentRoundIdx] || 0;
            const totalDiff = (m.start === 0 && m.end === 0) ? 0 : (m.end - m.start);
            const pureStrokeDiff = (m.start === 0 && m.end === 0) ? 0 : (totalDiff - rankPenalty);

            const penaltyText = rankPenalty === 0 ? "0.0만" : (rankPenalty > 0 ? "+" : "") + (rankPenalty / 10000).toFixed(1) + "만";
            const strokeText = pureStrokeDiff === 0 ? "0.0만" : (pureStrokeDiff > 0 ? "+" : "") + (pureStrokeDiff / 10000).toFixed(1) + "만";

            tbody.innerHTML += `
                <tr>
                    <td style="font-weight:800; color:var(--text-main);">${g}</td>
                    <td><input type="text" inputmode="numeric" class="money-input" value="${formatNumber(m.start)}" onfocus="this.select()" onchange="updateMoney('${g}', 'start', this.value)"></td>
                    <td><input type="text" inputmode="numeric" class="money-input" value="${formatNumber(m.end)}" onfocus="this.select()" onchange="updateMoney('${g}', 'end', this.value)"></td>
                    <td><span class="money-result-badge" style="background:${rankPenalty < 0 ? 'rgba(220,38,38,0.1)' : 'rgba(0,0,0,0.03)'}; color:${rankPenalty < 0 ? '#dc2626' : '#64748b'}; font-weight:900;">${penaltyText}</span></td>
                    <td><span class="money-result-badge" style="background:${pureStrokeDiff > 0 ? 'rgba(22,163,74,0.08)' : (pureStrokeDiff < 0 ? 'rgba(220,38,38,0.08)' : 'rgba(0,0,0,0.02)')}; color:${pureStrokeDiff > 0 ? '#16a34a' : (pureStrokeDiff < 0 ? '#dc2626' : '#64748b')}; font-weight:800;">${strokeText}</span></td>
                </tr>
            `;
        });
    }

    window.updateMoney = function(name, type, value) {
        saveState();
        const currentRoundIdx = selectedMoneyRoundIdx;
        if (!appData.roundMoney[currentRoundIdx]) appData.roundMoney[currentRoundIdx] = {};
        if (!appData.roundMoney[currentRoundIdx][name]) appData.roundMoney[currentRoundIdx][name] = { start: 0, end: 0 };
        
        appData.roundMoney[currentRoundIdx][name][type] = parseNumber(value);

    window.updateCourse = function(r, val) {
        saveState();
        if (!appData.courses) appData.courses = [];
        appData.courses[r] = val;
        syncToFirebase(appData);
    }

    window.updateScore = function(name, r, val) {
        saveState();
        if (!appData.scores) appData.scores = {};
        if (!appData.scores[name]) appData.scores[name] = [];
        appData.scores[name][r] = val === "" ? "" : parseNumber(val);
        syncToFirebase(appData);
        renderAll();
    }

    window.addRound = function() {
        saveState();
        appData.totalRounds++;
        if (!appData.courses) appData.courses = [];
        appData.courses.push("");

        golfers.forEach(g => {
            if (!appData.scores[g]) appData.scores[g] = [];
            appData.scores[g].push("");
        });

        const newRoundMoney = {};
        golfers.forEach(g => newRoundMoney[g] = { start: 0, end: 0 });
        if (!appData.roundMoney) appData.roundMoney = [];
        appData.roundMoney.push(newRoundMoney);

        selectedMoneyRoundIdx = appData.totalRounds - 1;
        syncToFirebase(appData);
        renderAll(); 
        showToast(`➕ ${appData.totalRounds}차전 추가됨`);
    }

    window.removeRound = function() {
        if (appData.totalRounds <= 2) {
            showToast("⚠️ 최소 2개 라운드가 필요합니다.");
            return;
        }
        saveState();
        appData.totalRounds--;
        appData.courses?.pop();
        golfers.forEach(name => appData.scores[name]?.pop());
        appData.roundMoney?.pop();

        if (selectedMoneyRoundIdx >= appData.totalRounds) selectedMoneyRoundIdx = appData.totalRounds - 1;
        syncToFirebase(appData);
        renderAll(); 
        showToast("➖ 최근 차전 삭제됨");
    }

    function calculateAndRender() {
        let targetR1 = -1, targetR2 = -1;
        for (let r = appData.totalRounds - 1; r >= 1; r--) {
            let completeCurr = true, completePrev = true;
            golfers.forEach(g => {
                const sCurr = appData.scores?.[g]?.[r];
                const sPrev = appData.scores?.[g]?.[r - 1];
                if (sCurr === "" || sCurr === undefined || isNaN(parseFloat(sCurr))) completeCurr = false;
                if (sPrev === "" || sPrev === undefined || isNaN(parseFloat(sPrev))) completePrev = false;
            });
            if (completeCurr && completePrev) {
                targetR1 = r - 1; targetR2 = r; break;
            }
        }
        if (targetR1 === -1) { targetR1 = 0; targetR2 = 1; }

        document.getElementById('infoText').innerHTML = `💡 <b>${targetR1 + 1}차 & ${targetR2 + 1}차 스코어</b> 기준 핸디캡 산출`;
        document.getElementById('matchCardTitle').innerHTML = `🤝 ${targetR1 + 1}·${targetR2 + 1}차 평균 기반 1:1 핸디캡 관계`;
        document.getElementById('avgHeaderTitle').innerHTML = `${targetR1 + 1}·${targetR2 + 1}차 평균`;

        document.querySelectorAll('#scoreTbody tr').forEach(row => {
            const name = row.getAttribute('data-name');
            const s1 = parseFloat(appData.scores?.[name]?.[targetR1]);
            const s2 = parseFloat(appData.scores?.[name]?.[targetR2]);
            const avgCell = row.querySelector('.avg-cell');
            if (!isNaN(s1) && !isNaN(s2)) avgCell.textContent = `${Math.floor((s1 + s2) / 2)}`;
            else avgCell.textContent = `-`;
        });

        processAllRoundSettlements();
        renderHandicapMatchCard(targetR1, targetR2);
    }

    function processAllRoundSettlements() {
        const totalRankProfit = {};
        const roundRankProfit = {};
        golferRankHistory = {};

        golfers.forEach(g => {
            totalRankProfit[g] = 0;
            roundRankProfit[g] = {};
            golferRankHistory[g] = [];
            globalHeadToHead[g] = {};
            golfers.forEach(g2 => {
                if (g !== g2) globalHeadToHead[g][g2] = { wins: 0, ties: 0, losses: 0, total: 0 };
            });
        });

        const historyList = document.getElementById('historyList');
        if (historyList) historyList.innerHTML = "";
        document.querySelectorAll('.rank-cell').forEach(rc => rc.textContent = '-');

        for (let r = 2; r < appData.totalRounds; r++) {
            const handicapAvg = {};
            let isComplete = true;

            golfers.forEach(g => {
                const s1 = parseFloat(appData.scores?.[g]?.[r - 2]);
                const s2 = parseFloat(appData.scores?.[g]?.[r - 1]);
                if (isNaN(s1) || isNaN(s2)) isComplete = false;
                handicapAvg[g] = Math.floor((s1 + s2) / 2);
            });

            const currentScores = {};
            golfers.forEach(g => {
                const sr = parseFloat(appData.scores?.[g]?.[r]);
                if (isNaN(sr)) isComplete = false;
                currentScores[g] = sr;
            });

            if (!isComplete) continue;

            const matchResults = {};
            golfers.forEach(g => matchResults[g] = { wins: 0, losses: 0, ties: 0, totalDiff: 0, headToHead: {} });

            for (let i = 0; i < golfers.length; i++) {
                for (let j = i + 1; j < golfers.length; j++) {
                    const g1 = golfers[i], g2 = golfers[j];
                    const g1Adjusted = currentScores[g1] - (handicapAvg[g1] - handicapAvg[g2]);
                    const g2Adjusted = currentScores[g2];

                    if (g1Adjusted < g2Adjusted) {
                        matchResults[g1].wins++; matchResults[g2].losses++;
                    } else if (g1Adjusted > g2Adjusted) {
                        matchResults[g1].losses++; matchResults[g2].wins++;
                    } else {
                        matchResults[g1].ties++; matchResults[g2].ties++;
                    }
                }
            }

            const sortedGolfers = [...golfers].sort((a, b) => {
                if (matchResults[b].wins !== matchResults[a].wins) return matchResults[b].wins - matchResults[a].wins;
                return matchResults[b].totalDiff - matchResults[a].totalDiff;
            });

            let roundHistoryHtml = `<div class="history-item"><div class="history-header">⛳ ${r + 1}차전 계급 정산 결과</div><div class="history-grid">`;

            sortedGolfers.forEach((golferName, index) => {
                const rankInfo = RANK_CONFIG[index];
                const profit = rankInfo.penalty;
                totalRankProfit[golferName] += profit;
                roundRankProfit[golferName][r] = profit;
                golferRankHistory[golferName].push(index);

                roundHistoryHtml += `
                    <div class="history-member">
                        <span style="font-weight:700;">${golferName}</span>
                        <div style="display:flex; align-items:center; gap:2px;">
                            <span class="rank-badge ${rankInfo.class}">${rankInfo.icon} ${rankInfo.name}</span>
                            <span style="font-weight:800; color:${profit > 0 ? '#16a34a' : (profit < 0 ? '#dc2626' : '#64748b')}">${profit === 0 ? "0원" : (profit / 10000) + "만"}</span>
                        </div>
                    </div>`;

                const row = document.querySelector(`tr[data-name="${golferName}"]`);
                if (row) {
                    const rc = row.querySelector('.rank-cell');
                    if (rc) rc.innerHTML = `<span class="rank-badge ${rankInfo.class}">${rankInfo.icon} ${rankInfo.name}</span>`;
                }
            });
            roundHistoryHtml += `</div></div>`;
            if (historyList) historyList.innerHTML += roundHistoryHtml;
        }

        cachedRoundRankProfit = roundRankProfit;

        const summaryGrid = document.getElementById('summaryGrid');
        if (summaryGrid) {
            summaryGrid.innerHTML = "";
            golfers.forEach(g => {
                const rankProfit = totalRankProfit[g] || 0;
                let totalPureStrokeProfit = 0;

                if (appData.roundMoney) {
                    for (let rIdx = 0; rIdx < appData.totalRounds; rIdx++) {
                        const m = appData.roundMoney[rIdx]?.[g];
                        if (m && (m.start > 0 || m.end > 0)) {
                            const rPenalty = roundRankProfit[g]?.[rIdx] || 0;
                            const pureStroke = (m.end - m.start) - rPenalty;
                            if (pureStroke < 0) totalPureStrokeProfit += pureStroke;
                        }
                    }
                }

                const finalBalance = rankProfit + totalPureStrokeProfit;
                summaryGrid.innerHTML += `
                    <div class="summary-item">
                        <div class="name" style="cursor:pointer;" onclick="openPersonalReport('${g}')">${g}</div>
                        <div class="detail-line">계급: ${(rankProfit / 10000).toFixed(1)}만</div>
                        <div class="detail-line">타수: ${(totalPureStrokeProfit / 10000).toFixed(1)}만</div>
                        <div class="final-total" style="color: ${finalBalance >= 0 ? '#16a34a' : '#dc2626'};">합산: ${(finalBalance / 10000).toFixed(1)}만</div>
                    </div>
                `;
            });
        }
    }

    function renderHandicapMatchCard(r1, r2) {
        const matchGrid = document.getElementById('matchGrid');
        if (!matchGrid) return;
        matchGrid.innerHTML = "";

        const avgScores = {};
        golfers.forEach(g => {
            const s1 = parseFloat(appData.scores?.[g]?.[r1]);
            const s2 = parseFloat(appData.scores?.[g]?.[r2]);
            if (!isNaN(s1) && !isNaN(s2)) avgScores[g] = Math.floor((s1 + s2) / 2);
        });

        if (Object.keys(avgScores).length < 4) {
            matchGrid.innerHTML = `<div style="grid-column: span 2; text-align:center; color:var(--text-sub);">스코어를 입력해 주세요.</div>`;
            return;
        }

        for (let i = 0; i < golfers.length; i++) {
            for (let j = i + 1; j < golfers.length; j++) {
                const g1 = golfers[i], g2 = golfers[j];
                const diff = avgScores[g1] - avgScores[g2];
                let matchText = diff > 0 ? `<b>${g1}</b> ➔ ${g2}에게 <b style="color:var(--primary-gold);">${diff}타</b> 받음` :
                                diff < 0 ? `<b>${g2}</b> ➔ ${g1}에게 <b style="color:var(--primary-gold);">${Math.abs(diff)}타</b> 받음` :
                                `<b>${g1}</b> vs <b>${g2}</b> ➔ <b style="color:#16a34a;">스크래치</b>`;
                
                matchGrid.innerHTML += `<div class="match-item">${matchText}</div>`;
            }
        }
    }

    window.resetAllData = function() {
        if (confirm("정말로 모든 데이터를 초기화하시겠습니까?")) {
            saveState();
            appData = getDefaultData();
            selectedMoneyRoundIdx = appData.totalRounds - 1;
            syncToFirebase(appData);
            renderAll();
            showToast("🔄 초기화 완료");
        }
    }

    window.openPersonalReport = function(golferName) {
        document.getElementById('reportTitle').textContent = `⛳ ${golferName} 님 리포트`;
        document.getElementById('personalReportModal')?.classList.add('active');
    }
    window.closePersonalReport = (e) => { if (!e || e.target === e.currentTarget || e.target.classList.contains('close-btn')) document.getElementById('personalReportModal')?.classList.remove('active'); }
</script>

</body>
</html>
