<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골프 리그 정산 및 일정</title>
  <style>
    :root {
      --bg-dark: #121824;
      --panel-bg: #182030;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-gold: #f8e71c;
      --text-white: #ffffff;
      --text-gray: #a0aec0;
      --text-red: #ff4d4f;
      --text-blue: #40a9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: var(--text-white);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 리그 공지 & 공금 영역 */
    .section-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-gold);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .info-label {
      font-size: 0.85rem;
      color: var(--text-gray);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: -0.3px;
      line-height: 1.25;
      word-break: keep-all;
    }

    /* 정산 테이블 영역 */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-gold);
      font-weight: 700;
    }

    .amount-minus {
      color: var(--text-red);
      font-weight: 700;
    }

    .amount-plus {
      color: var(--text-blue);
      font-weight: 700;
    }

    .highlight-row {
      background-color: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 420px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .section-title {
        font-size: 1.2rem;
      }
      .info-value {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. 리그 공지 & 공금 -->
    <div class="section-card">
      <div class="section-title">
        📢 리그 공지 & 모임 공금
      </div>
      <div class="grid-2">
        <div class="info-box">
          <div class="info-label">📅 다음 라운드 일시</div>
          <div class="info-value">8월 16일(일) 함평엘리체</div>
        </div>
        <div class="info-box">
          <div class="info-label">💰 남은 공금 잔액</div>
          <div class="info-value">79,000 원</div>
        </div>
      </div>
    </div>

    <!-- 2. 정산 현황 표 -->
    <div class="section-card">
      <div class="section-title">
        📊 통합 정산 현황
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>계급전</th>
              <th>타수내기 (3·4차)</th>
              <th>통합 누적 금액</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>김지명</td>
              <td class="amount-minus">-100,000</td>
              <td class="amount-plus">+75,000</td>
              <td class="amount-minus">-25,000</td>
            </tr>
            <!-- 다른 멤버 행이 있다면 여기에 추가하셔도 됩니다 -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

</body>
</html>
