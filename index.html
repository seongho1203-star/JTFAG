<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTFAG League - 프리미엄 정산</title>
    <link rel="apple-touch-icon" href="IMG_8075.jpeg">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --bg-main: #f4f6f8;
            --card-bg: #ffffff;
            --card-border: rgba(212, 212, 216, 0.6);
            --primary-gold: #b8860b;
            --gold-light: #fef9e7;
            --accent-green: #15803d;
            --accent-red: #dc2626;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--card-border);
        }

        .header-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 대표 이미지 -->
        <img src="IMG_8075.jpeg" alt="JTFAG League Image" class="header-img">
        
        <h1>JTFAG League - 프리미엄 정산</h1>

        <!-- 이곳에 추가하고 싶은 본문 내용을 계속 작성하시면 됩니다 -->
    </div>

</body>
</html>
