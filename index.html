<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase HTML 연동 테스트</title>
    <!-- Supabase JS 라이브러리 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ddd; }
        input, button { padding: 8px; margin-right: 5px; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>

    <h2>🚀 Supabase HTML 연동</h2>

    <!-- 데이터 추가 영역 -->
    <div class="box">
        <h3>데이터 추가하기</h3>
        <input type="text" id="inputData" placeholder="내용을 입력하세요">
        <button onclick="insertData()">저장</button>
    </div>

    <!-- 데이터 조회 영역 -->
    <div class="box">
        <h3>데이터 목록</h3>
        <button onclick="fetchData()">새로고침</button>
        <ul id="dataList">
            <li>데이터를 불러오는 중...</li>
        </ul>
    </div>

    <script>
        // 1. Supabase 설정 정보
        const SUPABASE_URL = 'https://xhulylksiexhtifyrokp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhodWx5bGtzaWV4aHRpZnlyb2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwODM0MTIsImV4cCI6MjEwMTY1OTQxMn0.gm2uMhOopFg1ZkAiFL-E_ZUB6jGi0Pwyj6fSvAuSmPg';

        // 2. Supabase 클라이언트 초기화
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 테이블 이름 (Supabase에 생성한 테이블명으로 변경하세요)
        const TABLE_NAME = 'todos'; 

        // 3. 데이터 조회 함수
        async function fetchData() {
            const listEl = document.getElementById('dataList');
            listEl.innerHTML = '<li>불러오는 중...</li>';

            const { data, error } = await _supabase
                .from(TABLE_NAME)
                .select('*');

            if (error) {
                console.error('조회 에러:', error);
                listEl.innerHTML = `<li>에러 발생: ${error.message}</li>`;
                return;
            }

            listEl.innerHTML = '';
            if (data.length === 0) {
                listEl.innerHTML = '<li>저장된 데이터가 없습니다.</li>';
                return;
            }

            data.forEach(item => {
                const li = document.createElement('li');
                // 테이블 구조에 맞춰 컬럼명을 수정하세요 (예: item.content 또는 item.title)
                li.textContent = item.content || JSON.stringify(item);
                listEl.appendChild(li);
            });
        }

        // 4. 데이터 추가 함수
        async function insertData() {
            const inputVal = document.getElementById('inputData').value;
            if (!inputVal.trim()) {
                alert('내용을 입력해주세요!');
                return;
            }

            // 테이블 구조에 맞춰 컬럼명을 수정하세요 (예: { content: inputVal })
            const { data, error } = await _supabase
                .from(TABLE_NAME)
                .insert([{ content: inputVal }]);

            if (error) {
                console.error('저장 에러:', error);
                alert(`저장 실패: ${error.message}`);
                return;
            }

            alert('성공적으로 저장되었습니다!');
            document.getElementById('inputData').value = '';
            fetchData(); // 목록 새로고침
        }

        // 페이지 로드 시 데이터 조회 실행
        fetchData();
    </script>

</body>
</html>
