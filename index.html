<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#edf2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>JTFAG League - 실시간 정산 시스템</title>

    <link rel="apple-touch-icon" href="IMG_8075.jpeg">
    <link rel="icon" type="image/jpeg" href="IMG_8075.jpeg">

    <!-- 디자인 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">

    <!-- 폭죽 애니메이션 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATsVxoLIkjK2DMPyaWeWE8rPC8ym2a9qQ",
            authDomain: "jtfag-8967b.firebaseapp.com",
            projectId: "jtfag-8967b",
            storageBucket: "jtfag-8967b.firebasestorage.app",
            messagingSenderId: "445292272434",
            appId: "1:445292272434:web:ea9cb5ebd0e0b2e4c4152b",
            measurementId: "G-K5PHFVZYYC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const gameDocRef = doc(db, "jtfag_league", "current_game");

        window.db = db;
        window.gameDocRef = gameDocRef;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
    </script>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h1>JTFAG LEAGUE</h1>
        <p class="subtitle">⛳ REALTIME GOLF SYSTEM</p>
    </div>

    <div class="notice-card">
        <h2>
            <span>📢 리그 공지 & 모임 공금</span>
            <button type="button" class="lock-btn" id="lockToggleBtn" onclick="toggleFundLock()" title="수정 잠금/해제">🔒</button>
        </h2>
        <div class="notice-grid">
            
            <div class="notice-box">
                <label>📅 다음 라운드 일정</label>
                <input type="text" id="nextRoundInput" class="notice-input" placeholder="예: 8/15(토) 함평엘리체" onchange="updateNoticeData()">
            </div>
            
            <div class="notice-box">
                <label>💰 공금 잔액</label>
                <input type="text" inputmode="numeric" id="clubFundInput" class="notice-input" placeholder="예: 150,000" readonly onclick="handleInputClick(this)" onfocus="this.select()" onchange="updateNoticeData()" style="text-align: right;">
            </div>
            
            <div class="weather-box">
                <span style="font-size:0.65rem; color:#bae6fd; font-weight:800; letter-spacing: 0.5px;">🌤️ 실시간 날씨 연동</span>
                <span id="weatherText" style="font-size:0.85rem; color:#ffffff; font-weight:800; word-break: keep-all; line-height: 1.3;">일정과 골프장을 입력해주세요</span>
            </div>

        </div>
    </div>

    <div class="total-summary-card">
        <h2>💰 JTFAG 통합 정산 요약</h2>
        <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <div class="money-card">
        <div class="money-header-flex">
            <h3>💵 차수별 정산</h3>
            <select id="moneyRoundSelect" class="round-select-badge" onchange="changeMoneyRound(this.value)"></select>
        </div>
        <table class="money-table">
            <thead>
                <tr>
                    <th style="width: 18%;">이름</th>
                    <th style="width: 25%;">시작 금액</th>
                    <th style="width: 25%;">남은 금액</th>
                    <th style="width: 16%;">계급정산</th>
                    <th style="width: 16%;">타수정산</th>
                </tr>
            </thead>
            <tbody id="moneyTbody"></tbody>
        </table>
    </div>

    <div class="info-card">
        <span class="info-text" id="infoText">💡 <b>최근 2경기 스코어</b> 기준 1:1 핸디캡 산출</span>
        <span class="save-status" id="saveStatus">⚡ 연결 중...</span>
    </div>

    <div class="btn-group">
        <div class="left-btns">
            <button type="button" class="action-btn add-btn" onclick="addRound()">+ 차수 추가</button>
            <button type="button" class="action-btn remove-btn" onclick="removeRound()">- 최근 삭제</button>
        </div>
        <div class="right-btns">
            <button type="button" class="action-btn reset-btn" onclick="resetAllData()">🔄 전체 초기화</button>
            <button type="button" class="action-btn undo-btn" onclick="undoLastAction()">↩️ 되돌리기</button>
        </div>
    </div>

    <div class="scroll-hint">↔️ 표를 좌우로 스크롤하여 확인하세요</div>
    <div class="table-wrapper">
        <table id="scoreTable">
            <thead>
                <tr id="headerRow"><th>이름</th></tr>
            </thead>
            <tbody id="scoreTbody"></tbody>
        </table>
    </div>

    <div class="match-card">
        <h3 id="matchCardTitle">🤝 최근 2경기 평균 기반 1:1 핸디캡 관계</h3>
        <div class="match-grid" id="matchGrid"></div>
    </div>

    <div class="history-btn-container">
        <button type="button" class="open-history-btn" onclick="openHistoryModal()">📜 라운드별 계급 정산 이력 보기 ▾</button>
    </div>
</div>

<!-- 모달창 및 숨김 요소들 -->
<div class="modal-overlay" id="historyModal" onclick="closeHistoryModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>📜 라운드별 계급 정산 이력</h3>
            <button type="button" class="close-btn" onclick="closeHistoryModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="history-list" id="historyList"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="photoModal" onclick="closePhotoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width:90vw;">
        <div class="modal-header">
            <h3 id="photoModalTitle">📷 사진</h3>
            <span id="photoPageIndicator" style="font-size:0.8rem; color:#fef08a; margin-left:8px; flex:1;">(1 / 1)</span>
            <button type="button" class="close-btn" onclick="closePhotoModal()">✕</button>
        </div>
        <div class="modal-body" style="text-align:center; padding:8px; display:flex; flex-direction:column;">
            <div id="modalPreviewContainer" class="modal-preview-container"></div>
            <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">↔️ 좌우로 스와이프하여 이동</div>
            <div style="margin-top:12px; display:flex; justify-content:center; gap:8px;">
                <button type="button" class="action-btn add-btn" onclick="triggerAddMorePhoto()">➕ 추가하기</button>
                <button type="button" class="action-btn reset-btn" onclick="deleteCurrentlyViewedPhoto()">🗑️ 현재 사진 삭제</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="personalReportModal" onclick="closePersonalReport(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="reportTitle">⛳ 개인 리포트</h3>
            <button type="button" class="close-btn" onclick="closePersonalReport()">✕</button>
        </div>
        <div class="modal-body" id="reportContent"></div>
    </div>
</div>

<div id="celebrationOverlay" class="celebration-overlay">
    <div id="celebrationText" class="celebration-text"></div>
</div>

<input type="file" id="globalFileInput" multiple accept="image/*" style="display:none;" onchange="handleGlobalFileChange(this)">
<div id="customToast"></div>

<!-- 자바스크립트 로직 파일 연결 -->
<script src="app.js"></script>

</body>
</html>
