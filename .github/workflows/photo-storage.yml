name: 사진 저장소 용량 알림

on:
  schedule:
    # 매주 월요일 한국시간 오전 9시 10분 (= 일요일 UTC 0시 10분 → GitHub이 붐비는 정각을 피했다).
    # 80%를 넘었을 때만 사진 관리자(신성호)에게 푸시가 간다. 넘지 않으면 아무 일도 안 한다.
    - cron: '10 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 보내지 않고 확인만'
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm install web-push@3

      - name: 용량 확인 · 알림
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/check-photo-storage.js
