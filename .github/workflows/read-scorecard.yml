name: 스코어카드 판독

on:
  schedule:
    # 예비용이다. 아래 cron은 '5분마다'라고 적혀 있지만 GitHub은 지키지 않는다 —
    # 실제로 재 보니 33시간 동안 396회 중 28회(7%)만 돌았고 중앙값이 59분,
    # 최대 210분이었다. 주기를 더 줄여도 소용없다(무료 공개 저장소의 정책이다).
    # 그래서 진짜 방아쇠는 아래 workflow_dispatch다 — 앱이 사진을 올리는 즉시
    # Supabase 함수(kick-scorecard)가 API로 이걸 부른다. docs/즉시판독.md 참고.
    # 이 cron은 그게 실패했을 때 언젠가는 처리되게 하는 그물일 뿐이다. 기대지 말 것.
    - cron: '*/5 * * * *'

  # 앱이 부르는 정상 경로이자, 급할 때 Actions 탭에서 직접 누르는 길이기도 하다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '판독만 해 보고 stats.js는 건드리지 않기'
        type: boolean
        default: false

# stats.js를 커밋해야 해서 쓰기 권한이 필요하다.
permissions:
  contents: write

# 동시에 두 번 돌면 같은 요청을 두 번 판독하게 된다.
concurrency:
  group: read-scorecard
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm install @anthropic-ai/sdk web-push@3

      - name: 스코어카드 판독
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 판독이 끝나면 알림을 보낸다 (성공은 전원, 실패는 올린 사람에게만).
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/read-scorecard.js
