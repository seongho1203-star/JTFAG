name: 사진 목록 복구

# 차수를 지웠다가 되돌렸을 때처럼 payload.roundPhotos만 비어 버린 경우,
# Storage에 남아 있는 파일로 목록을 다시 만든다.
# 파일을 지우지도 만들지도 않는다 — payload의 URL 목록만 채운다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '무엇이 되살아나는지 확인만 (끄면 실제로 고침)'
        type: boolean
        default: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 복구
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/restore-photos.js
