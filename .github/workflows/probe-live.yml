name: 라이브스코어 확인 (임시)

# 스마트스코어 라이브스코어 링크를 밖에서 읽을 수 있는지 한 번 확인해 보는 용도.
# 확인이 끝나면 이 파일은 지운다.

on:
  workflow_dispatch:
    inputs:
      url:
        description: '확인할 주소'
        required: true
        default: 'https://smartscore.kr/short/?206ed69cf'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 주소 따라가 보기
        env:
          TARGET: ${{ inputs.url }}
        run: |
          echo "=== 리다이렉트 따라가기 ==="
          curl -sSL -o body.html -D headers.txt \
            -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1' \
            -w '최종주소: %{url_effective}\n상태: %{http_code}\n리다이렉트: %{num_redirects}회\n타입: %{content_type}\n크기: %{size_download} bytes\n' \
            --max-time 30 "$TARGET" || echo "요청 실패"

          echo
          echo "=== 응답 헤더 ==="
          head -40 headers.txt || true

          echo
          echo "=== 본문 앞부분 (600자) ==="
          head -c 600 body.html || true

          echo
          echo
          echo "=== 로그인/앱설치 벽인지 ==="
          for w in 로그인 회원가입 앱설치 다운로드 login signin download appstore play.google; do
            if grep -qi "$w" body.html 2>/dev/null; then echo "  '$w' 있음"; fi
          done

          echo
          echo "=== 스코어처럼 보이는 게 있는지 ==="
          for w in 타수 스코어 홀 par 버디 birdie score hole; do
            if grep -qi "$w" body.html 2>/dev/null; then echo "  '$w' 있음"; fi
          done

          echo
          echo "=== 자바스크립트로 그리는 페이지인지 ==="
          echo -n "  script 태그: "; grep -o '<script' body.html 2>/dev/null | wc -l
          echo -n "  본문 글자수(태그 뺀): "; sed 's/<[^>]*>//g' body.html 2>/dev/null | tr -d '[:space:]' | wc -c
