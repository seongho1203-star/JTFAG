name: 라운드 알림

on:
  schedule:
    # 매일 한국시간 오전 8시 30분 (= 전날 UTC 23시 30분).
    # 발송 여부는 스크립트가 한국 날짜로 판단하므로 UTC 날짜가 하루 밀려도 상관없다.
    #
    # 예약 시각은 어디까지나 '가장 이른 시각'이다 — GitHub이 붐비면 뒤로 민다.
    # 예전엔 UTC 정각(0시)이었는데 전 세계 예약이 몰리는 시각이라 매일 3시간쯤 밀려
    # 낮 12시에 왔다. 정각을 피한 것만으로도 밀리는 폭이 줄어든다.
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 보내지 않고 확인만'
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm install web-push@3

      - name: 알림 보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # 앱에 알림 설정이 없을 때만 쓰이는 예비값. 쉼표로 여러 날을 적을 수 있다 ('3,0').
          REMIND_DAYS_BEFORE: '2'
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/send-reminder.js
